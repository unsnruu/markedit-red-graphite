name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn check
      - run: yarn build
      - run: node --check dist/markedit-theme-red-graphite.js
      - run: git diff --exit-code -- dist
